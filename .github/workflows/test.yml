name: Test

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create .npmrc
        run: echo "@abstractplay:registry=https://npm.pkg.github.com/" > .npmrc
      - run: echo "//npm.pkg.github.com/:_authToken=${{secrets.PAT_READ_PACKAGES}}" >> .npmrc

      - name: Install NPM dependencies
        run: npm ci

      - name: Check ci-deps manifests
        run: node bin/check-ci-deps.mjs

      - name: Install pinned AP dependencies (for tests)
        run: node bin/install-ap-deps.mjs --stage dev --for-tests

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Test (Lambda init smoke)
        run: npm test
